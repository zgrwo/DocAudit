# 通用技术写作规范术语
# 格式: pattern 为需要检测的模式（支持正则），preferred 为推荐写法

category: 通用技术写作
version: '1.0'

terms:
  # 中文重复用词由 LanguageAuditor._check_builtin_chinese_patterns 统一处理，
  # 不在此重复定义（避免同句两条 finding）。

  # 英文技术写作规范
  - pattern: '(?i)utilize'
    preferred: use
    context: 技术写作中使用简洁动词
  - pattern: '(?i)in order to'
    preferred: to
    context: 删除冗余短语
  - pattern: '(?i)due to the fact that'
    preferred: because
    context: 简化表达

  # 单位规范
  - pattern: '(?<![a-zA-Z])um(?![a-zA-Z/])'
    preferred: 'μm'
    context: 使用标准微米符号

  # 中英文排版/标点由 FMT-MIXED-001~003 与 PUNCT-003 统一处理，
  # 术语表不再重复定义，避免同一问题出现 TERM-通用技术写作 + FMT-MIXED 两条 finding。
