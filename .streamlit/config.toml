[theme]
primaryColor = "#1E3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
# 安全红线: 仅绑定本机回环地址，禁止默认 0.0.0.0 未认证暴露到内网
address = "localhost"
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = true
# 上传面显式声明 (2026-09-06 审查 F-2): 不依赖 Streamlit 默认 200MB 兜底
maxUploadSize = 100

[browser]
gatherUsageStats = false
