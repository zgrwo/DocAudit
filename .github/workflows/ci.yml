name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:  # 支持 Actions 页面手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run tests with coverage
        # M14: 合并重复运行 (删除冗余 -v 步骤，-q 已够定位失败)
        # 覆盖率门槛: 2026-10-29 实测 TOTAL 87% (5118 语句)，取 82% 留环境差异余量；
        # cli.py 48% — 由 test_cli_direct.py / test_cli_exit_codes.py subprocess 测试共同覆盖
        run: pytest tests/ -q --cov=src --cov-report=term --cov-fail-under=82

      - name: Validate DISPATCH integrity
        run: |
          python -c "from src.auditors.custom_rules import CustomRulesAuditor; errors = CustomRulesAuditor.validate_dispatch(); print(errors); assert errors == [], f'DISPATCH validation failed: {errors}'"

      - name: Validate configuration (rules/glossary/vocab)
        run: python src/cli.py rules validate

      - name: Release self-check (version / changelog / files / --version)
        # 开发分支允许 [Unreleased]；发行提交（顶部为版本段）同样通过
        run: python scripts/check_release.py --allow-unreleased

      - name: Verify rules.md parsing
        run: |
          python -c "from src.engines.rule_parser import parse_rules_md; rules = parse_rules_md('rules.md'); print(f'{len(rules)} rules parsed'); assert len(rules) == 30, f'Expected exactly 30 rules (宽松下限拦不住规则数缓慢缩减, 2026-09-06 审查 G-1), got {len(rules)}; 规则数变更需同步 rules.md / api-reference.md / tests/test_rules.py / test_gates 文档数字白名单'"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/ scripts/ app.py

      - name: Run ruff format check
        run: ruff format --check src/ tests/ scripts/ app.py

  windows:
    # Windows 专属快测 (2026-11): 项目主打 Windows（编码回退/文件锁/路径语义/
    # UTF-8 控制台），历史上多次出现"只在 Windows 复现"的缺陷；ubuntu 矩阵
    # 拦不住。只跑非 slow 子集（~40s），完整矩阵仍由 ubuntu test job 承担。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Fast tests (Windows)
        run: pytest tests/ -q -m "not slow"

      - name: Validate configuration (Windows, non-ASCII path + console)
        run: python src/cli.py rules validate

      - name: Audit fixtures on Windows (smoke)
        # 真实文件 → CLI 全链路（含中文输出、报告落盘、退出码），Windows 专属冒烟
        shell: pwsh
        run: |
          python src/cli.py tests\fixtures\sample.pptx -o "$env:TEMP\docaudit_ci.html"
          $code = $LASTEXITCODE
          if ($code -ne 1) { Write-Host "期望 exit 1（样例含 error 级发现），实际 $code"; exit 1 }
          if (-not (Test-Path "$env:TEMP\docaudit_ci.html")) { Write-Host "HTML 报告未生成"; exit 1 }
          exit 0

  lockfile:
    # 锁文件自洽性门禁: dependabot 单点 bump 可能破坏版本约束
    # (实测: pyarrow 25 违反 streamlit<25, typer 0.27 违反 docling-core<0.27 等)
    # 必须在 Windows 上原生解析: 锁文件是 Windows 生成契约 (含 pywin32 等
    # 平台专属依赖与 antlr 的 sdist, 跨平台 flags 无法覆盖)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Validate offline lockfiles resolve
        shell: pwsh
        run: |
          foreach ($profile in @('core', 'pdf', 'full')) {
            Write-Host "== $profile =="
            python -m pip install --dry-run --ignore-installed -r requirements-$profile.txt .
            if ($LASTEXITCODE -ne 0) {
              Write-Host "lockfile requirements-$profile.txt 无法解析，请回退冲突 pin 或升级约束方"
              exit 1
            }
          }