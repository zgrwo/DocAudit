name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:  # 支持 Actions 页面手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run tests with coverage
        # M14: 合并重复运行 (删除冗余 -v 步骤，-q 已够定位失败)
        # 覆盖率门槛: src/ 基线 84% (2026-08-19 实测，TOTAL 3263 语句)，
        # 新测试持续提高；cli.py 54% — 由 test_cli_direct.py 直接单测 + subprocess 测试共同覆盖
        run: pytest tests/ -q --cov=src --cov-report=term --cov-fail-under=70

      - name: Validate DISPATCH integrity
        run: |
          python -c "from src.auditors.custom_rules import CustomRulesAuditor; errors = CustomRulesAuditor.validate_dispatch(); print(errors); assert errors == [], f'DISPATCH validation failed: {errors}'"

      - name: Verify rules.md parsing
        run: |
          python -c "from src.engines.rule_parser import parse_rules_md; rules = parse_rules_md('rules.md'); print(f'{len(rules)} rules parsed'); assert len(rules) >= 20, f'Expected >=20 rules, got {len(rules)}'"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # .[dev] 保证测试收集环境与 test job 一致 (check_doc_numbers 的
        # --collect-only 需要 python-pptx/python-docx 等基础依赖才能完整收集)
        run: pip install ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/ tools/ scripts/ app.py

      - name: Run ruff format check
        run: ruff format --check src/ tests/ tools/ scripts/ app.py

      - name: Check bare exception handlers
        run: python tools/check_bare_handlers.py

      - name: Check html.escape compliance
        run: python tools/check_html_escape.py

      - name: Check api-reference.md sync
        run: python tools/check_api_sync.py

      - name: Check skill sync
        # skills/ 与 .qoder/skills/ 注册副本正文一致性 (prompt 修改后需同步)
        run: python tools/check_skill_sync.py

      - name: Check doc number consistency
        # 防数字漂移复发 (历史 3+ 次: 测试数/规则数/检查数在多处硬编码后漂移)
        run: python tools/check_doc_numbers.py

  lockfile:
    # 锁文件自洽性门禁: dependabot 单点 bump 可能破坏版本约束
    # (实测: pyarrow 25 违反 streamlit<25, typer 0.27 违反 docling-core<0.27 等)
    # 必须在 Windows 上原生解析: 锁文件是 Windows 生成契约 (含 pywin32 等
    # 平台专属依赖与 antlr 的 sdist, 跨平台 flags 无法覆盖)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Validate offline lockfiles resolve
        shell: pwsh
        run: |
          foreach ($profile in @('core', 'pdf', 'full')) {
            Write-Host "== $profile =="
            python -m pip install --dry-run --ignore-installed -r requirements-$profile.txt .
            if ($LASTEXITCODE -ne 0) {
              Write-Host "lockfile requirements-$profile.txt 无法解析，请回退冲突 pin 或升级约束方"
              exit 1
            }
          }