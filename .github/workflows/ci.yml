name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:  # 支持 Actions 页面手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run tests
        run: pytest tests/ -v

      - name: Validate DISPATCH integrity
        run: |
          python -c "from src.auditors.custom_rules import CustomRulesAuditor; errors = CustomRulesAuditor.validate_dispatch(); print(errors); assert errors == [], f'DISPATCH validation failed: {errors}'"

      - name: Verify rules.md parsing
        run: |
          python -c "from src.engines.rule_parser import parse_rules_md; rules = parse_rules_md('rules.md'); print(f'{len(rules)} rules parsed'); assert len(rules) >= 20, f'Expected >=20 rules, got {len(rules)}'"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.3

      - name: Run ruff check
        run: ruff check src/ tests/ tools/ scripts/ app.py

      - name: Check bare exception handlers
        run: python tools/check_bare_handlers.py

      - name: Check html.escape compliance
        run: python tools/check_html_escape.py

      - name: Check api-reference.md sync
        run: python tools/check_api_sync.py

      - name: Validate offline lockfiles resolve
        # 锁文件自洽性门禁: dependabot 单点 bump 可能破坏版本约束
        # (实测: pyarrow 25 违反 streamlit<25, typer 0.27 违反 docling-core<0.27 等)
        run: |
          for profile in core pdf full; do
            echo "== $profile =="
            python -m pip install --dry-run --ignore-installed -r requirements-$profile.txt . >/dev/null \
              || { echo "lockfile requirements-$profile.txt 无法解析，请回退冲突 pin 或升级约束方"; exit 1; }
          done
