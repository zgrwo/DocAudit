name: CodeQL

# 2026-11 供应链安全补齐：CodeQL 静态扫描（Python）+ 结果上传 code scanning。
# 注意：action 按项目惯例固定 commit SHA（Dependabot 每月会提 PR 更新）。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          languages: ${{ matrix.language }}
          # Python 无需编译，build-mode: none 可避免 autobuild 误判
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
